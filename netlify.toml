# Netlify builds only the static site. Live status is NOT baked into the build:
# the page fetches status.json from the monitor-data branch at runtime, so
# hourly updates never need a redeploy.
[build]
  base = "frontend"
  command = "npm test && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex"
    Referrer-Policy = "no-referrer"
